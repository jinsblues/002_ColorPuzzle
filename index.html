<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Puzzle</title>

    <!-- 매니페스트 파일 연결 -->
    <link rel="manifest" href="manifest.json">
    <!-- 아이폰 바탕화면 아이콘 강제 설정 (핵심) -->
    <link rel="apple-touch-icon" href="puzzle.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 16개 격자가 들어갈 퍼즐 보드 -->
    <div id="game-board"></div>

    <!-- 하단 UI 정보창 -->
    <div id="info-panel">
        <div id="time-display">Time: <span id="time-count">00:00:00</span></div>
        <div id="touch-display">Hit: <span id="hit-count">0</span></div>
    </div>

        <!-- [수정됨] 게임 클리어 시 나타날 축하 메시지 창 및 다시하기 버튼 -->
    <div id="win-message" style="display: none;">
        <div style="margin-bottom: 20px;">Congratulation!</div>
        <button id="restart-btn">다시하기</button>

    <script src="app.js"></script>
</body>
</html>
